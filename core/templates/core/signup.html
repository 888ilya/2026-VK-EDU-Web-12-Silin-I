{% extends 'base.html' %}

{% block content %}
    <h2 class="mb-4">Регистрация</h2>
    <form>
        <div class="mb-3">
            <label class="form-label">Логин</label>
            <input type="text" class="form-control" placeholder="Введите логин">
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" placeholder="Введите email">
        </div>
        <div class="mb-3">
            <label class="form-label">Пароль</label>
            <input type="password" class="form-control" placeholder="Введите пароль">
        </div>
        <div class="mb-3">
            <label class="form-label">Повторите пароль</label>
            <input type="password" class="form-control" placeholder="Повторите пароль">
        </div>
        <div class="mb-3">
            <label class="form-label">Загрузите аватар</label>
            <input type="file" class="form-control">
        </div>
        <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
    </form>
{% endblock %}
