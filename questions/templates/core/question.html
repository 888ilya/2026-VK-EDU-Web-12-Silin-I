{% extends 'base.html' %}
{% load static %}

{% block content %}
    <!-- Карточка самого вопроса (данные подставляются из views.py) -->
    <div class="card mb-4">
        <div class="card-body d-flex">
            <div class="d-flex flex-column align-items-center me-3" style="min-width: 80px;">
                <img src="{% static 'img/avatar.png' %}" class="rounded mb-2" alt="Avatar" width="60">
                <input type="number" class="form-control form-control-sm text-center" value="5" readonly>
            </div>
            <div class="flex-grow-1">
                <h4 class="card-title">{{ question.title }}</h4>
                <p class="card-text">{{ question.text }}</p>
                <div class="mt-3">
                    <a href="{% url 'tag' 'python' %}" class="badge bg-secondary text-decoration-none">python</a>
                    <a href="{% url 'tag' 'django' %}" class="badge bg-secondary text-decoration-none">django</a>
                </div>
            </div>
        </div>
    </div>

    <hr>
    <h4 class="mb-3">Ответы</h4>

    <!-- Пример ответа-заглушки -->
    <div class="card mb-3">
        <div class="card-body d-flex">
            <div class="d-flex flex-column align-items-center me-3" style="min-width: 80px;">
                <img src="{% static 'img/avatar.png' %}" class="rounded mb-2" alt="Avatar" width="60">
                <input type="number" class="form-control form-control-sm text-center" value="2" readonly>
            </div>
            <div class="flex-grow-1">
                <p class="card-text">Это пример отличного ответа на твой вопрос!</p>
                <div class="form-check mt-2">
                    <input class="form-check-input" type="checkbox" value="" id="correctAnswer" checked disabled>
                    <label class="form-check-label text-success fw-bold" for="correctAnswer">
                        Правильный ответ
                    </label>
                </div>
            </div>
        </div>
    </div>

    <hr>
    
    <!-- Форма добавления нового ответа -->
    <form class="mt-4">
        <div class="mb-3">
            <label class="form-label">Ваш ответ</label>
            <textarea class="form-control" rows="4" placeholder="Введите ваш ответ..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Ответить</button>
    </form>
{% endblock %}
