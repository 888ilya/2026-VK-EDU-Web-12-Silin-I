{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q&A Service - Ask and Answer</title>
    <!-- Локальное подключение Bootstrap и собственных стилей -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="d-flex flex-column min-vh-100">
    
    <!-- Header -->
    <header class="navbar navbar-expand-lg navbar-light bg-light mb-4 border-bottom">
        <div class="container">
            <a class="navbar-brand" href="{% url 'index' %}">AskMe</a>
            <form class="d-flex mx-auto w-50">
                <input class="form-control me-2" type="search" placeholder="Поиск вопросов..." aria-label="Search">
                <button class="btn btn-outline-success" type="submit">Найти</button>
            </form>
            <div class="d-flex align-items-center">
                <div class="me-3">
                    <a href="{% url 'login' %}" class="text-decoration-none">Log in</a> | 
                    <a href="{% url 'signup' %}" class="text-decoration-none">Sign up</a>
                </div>
                <a href="{% url 'ask' %}" class="btn btn-primary">Задать вопрос</a>
            </div>
        </div>
    </header>

    <!-- Основной контент страницы -->
    <div class="container flex-grow-1">
        <div class="row">
            <!-- Центральная колонка (main) -->
            <main class="col-lg-9">
                {% block content %}
                {% endblock %}
            </main>

            <!-- Правая колонка (sidebar) -->
            <aside class="col-lg-3">
                <div class="card mb-4">
                    <div class="card-header">Popular tags</div>
                    <div class="card-body">
                        <a href="{% url 'tag' 'python' %}" class="badge bg-secondary text-decoration-none">python</a>
                        <a href="{% url 'tag' 'cpp' %}" class="badge bg-secondary text-decoration-none">c++</a>
                        <a href="{% url 'tag' 'git' %}" class="badge bg-secondary text-decoration-none">git</a>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header">Best members</div>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item"><a href="#" class="text-decoration-none text-dark">Mr. Freeman</a></li>
                        <li class="list-group-item"><a href="#" class="text-decoration-none text-dark">Dr. House</a></li>
                    </ul>
                </div>
            </aside>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white py-3 mt-auto text-center">
        <div class="container">
            <span>&copy; 2026 VK Edu Web Development</span>
        </div>
    </footer>

    <!-- Локальное подключение скриптов Bootstrap -->
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
