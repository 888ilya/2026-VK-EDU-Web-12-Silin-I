<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q&A Service - Ask and Answer</title>
    <!-- Локальное подключение Bootstrap и собственных стилей -->
    <link rel="stylesheet" href="static/css/bootstrap.min.css">
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">
    
    <!-- Header -->
    <header class="navbar navbar-expand-lg navbar-light bg-light mb-4 border-bottom">
        <div class="container">
            <a class="navbar-brand" href="index.html">AskMe</a>
            <form class="d-flex mx-auto w-50">
                <input class="form-control me-2" type="search" placeholder="Поиск вопросов..." aria-label="Search">
                <button class="btn btn-outline-success" type="submit">Найти</button>
            </form>
            <div class="d-flex align-items-center">
                <div class="me-3">
                    <a href="login.html" class="text-decoration-none">Log in</a> | 
                    <a href="signup.html" class="text-decoration-none">Sign up</a>
                </div>
                <a href="ask.html" class="btn btn-primary">Задать вопрос</a>
            </div>
        </div>
    </header>

    <!-- Основной контент страницы -->
    <div class="container flex-grow-1">
        <div class="row">
            <!-- Центральная колонка (main) -->
            <main class="col-lg-9">
                <main class="col-lg-9">
    <div class="row">
        <!-- Ограничиваем ширину формы для эстетики -->
        <div class="col-md-8">
            <h2 class="mb-4">Вход</h2>
            
            <!-- Глобальная ошибка формы (над формой) -->
            <div class="alert alert-danger" role="alert">
                Вы ввели неправильный email или пароль. Попробуйте еще раз.
            </div>

            <form>
                <div class="mb-3">
                    <label for="loginEmail" class="form-label">Email адрес</label>
                    <!-- Класс is-invalid подсвечивает поле красным -->
                    <input type="email" class="form-control is-invalid" id="loginEmail" placeholder="Например: ilya@bmstu.ru" value="ilya@bmstu.ru">
                    <!-- Локальная ошибка поля (под полем)[cite: 1] -->
                    <div class="invalid-feedback">
                        Пожалуйста, введите валидный email адрес.
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="loginPassword" class="form-label">Пароль</label>
                    <input type="password" class="form-control" id="loginPassword" placeholder="Введите пароль">
                </div>
                
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">Запомнить меня</label>
                </div>
                
                <button type="submit" class="btn btn-primary mb-3">Войти</button>
                
                <!-- Ссылка на регистрацию[cite: 1] -->
                <p class="text-muted">Ещё нет аккаунта? <a href="signup.html" class="text-decoration-none">Зарегистрируйтесь!</a></p>
            </form>
        </div>
    </div>
</main>
            </main>

            <!-- Правая колонка (sidebar) -->
            <aside class="col-lg-3">
                <div class="card mb-4">
                    <div class="card-header">Popular tags</div>
                    <div class="card-body">
                        <span class="badge bg-secondary">python</span>
                        <span class="badge bg-secondary">c++</span>
                        <span class="badge bg-secondary">git</span>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header">Best members</div>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item">Mr. Freeman</li>
                        <li class="list-group-item">Dr. House</li>
                    </ul>
                </div>
            </aside>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white py-3 mt-auto text-center">
        <div class="container">
            <span>&copy; 2026 VK Edu Web Development</span>
        </div>
    </footer>

    <!-- Локальное подключение скриптов Bootstrap -->
    <script src="static/js/bootstrap.bundle.min.js"></script>
</body>
</html>
